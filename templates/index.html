<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SentimentIQ — Amazon ML Summer School Project</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131c;
      --surface2: #1c1c2a;
      --border: #2a2a3d;
      --accent: #ff6b35;
      --accent2: #7c3aed;
      --pos: #22c55e;
      --neg: #ef4444;
      --neu: #f59e0b;
      --text: #e8e8f0;
      --muted: #6b6b8a;
      --font: 'Syne', sans-serif;
      --mono: 'DM Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,58,237,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,58,237,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      position: relative;
      z-index: 1;
    }

    /* Header */
    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 2.5rem 0 3rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 3rem;
      gap: 1rem;
    }
    .logo-area h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .logo-area h1 span { color: var(--accent); }
    .logo-area p {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.5rem;
      letter-spacing: 0.05em;
    }
    .badge {
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      color: #fff;
      font-size: 0.65rem;
      font-family: var(--mono);
      font-weight: 500;
      padding: 0.3rem 0.7rem;
      border-radius: 2px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      margin-top: 0.3rem;
    }

    /* Input section */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .input-card label {
      display: block;
      font-size: 0.7rem;
      font-family: var(--mono);
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.9rem;
      line-height: 1.7;
      padding: 1rem;
      resize: vertical;
      min-height: 130px;
      transition: border-color 0.2s;
      outline: none;
    }
    textarea:focus { border-color: var(--accent2); }
    textarea::placeholder { color: var(--muted); }

    .controls {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    button {
      font-family: var(--font);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      border: none;
      cursor: pointer;
      border-radius: 3px;
      padding: 0.65rem 1.4rem;
      transition: all 0.15s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #ff8255; transform: translateY(-1px); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { color: var(--text); border-color: var(--muted); }
    #charCount {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
      margin-left: auto;
      align-self: center;
    }

    /* Result */
    #result {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.3s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .result-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .sentiment-label {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .sentiment-label.Positive { color: var(--pos); }
    .sentiment-label.Negative { color: var(--neg); }
    .sentiment-label.Neutral  { color: var(--neu); }

    .score-pill {
      font-family: var(--mono);
      font-size: 0.75rem;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      border: 1px solid;
    }
    .score-pill.Positive { color: var(--pos); border-color: var(--pos); background: rgba(34,197,94,0.08); }
    .score-pill.Negative { color: var(--neg); border-color: var(--neg); background: rgba(239,68,68,0.08); }
    .score-pill.Neutral  { color: var(--neu); border-color: var(--neu); background: rgba(245,158,11,0.08); }

    .result-body {
      padding: 1.25rem 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 560px) { .result-body { grid-template-columns: 1fr; } }

    .metric-block label {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.4rem;
    }
    .confidence-bar {
      height: 6px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.5rem;
    }
    .confidence-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }
    .confidence-fill.Positive { background: var(--pos); }
    .confidence-fill.Negative { background: var(--neg); }
    .confidence-fill.Neutral  { background: var(--neu); }
    #confidenceVal {
      font-family: var(--mono);
      font-size: 0.85rem;
    }

    .highlights-area label {
      font-family: var(--mono);
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.6rem;
    }
    .highlights-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .highlight-chip {
      font-family: var(--mono);
      font-size: 0.72rem;
      padding: 0.2rem 0.55rem;
      border-radius: 2px;
    }
    .highlight-chip.positive { background: rgba(34,197,94,0.12); color: var(--pos); }
    .highlight-chip.negative { background: rgba(239,68,68,0.12); color: var(--neg); }

    /* History */
    #historySection { display: none; }
    .section-title {
      font-size: 0.65rem;
      font-family: var(--mono);
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    .history-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .history-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .history-item:hover { border-color: var(--accent2); }
    .history-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .history-dot.Positive { background: var(--pos); }
    .history-dot.Negative { background: var(--neg); }
    .history-dot.Neutral  { background: var(--neu); }
    .history-text {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .history-label {
      font-size: 0.7rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .history-label.Positive { color: var(--pos); }
    .history-label.Negative { color: var(--neg); }
    .history-label.Neutral  { color: var(--neu); }

    /* Examples */
    .examples-section { margin-top: 2.5rem; }
    .examples-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 0.6rem;
    }
    .example-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.75rem;
      font-weight: 400;
      text-align: left;
      padding: 0.75rem 1rem;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.5;
    }
    .example-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      transform: none;
    }

    /* Loading */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 0.5rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      margin-top: 4rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-area">
      <h1>Sentiment<span>IQ</span></h1>
      <p>// NLP · Machine Learning · Python + Flask</p>
    </div>
    <div style="text-align:right">
      <div class="badge">Amazon ML Summer School 2026</div>
    </div>
  </header>

  <div class="input-card">
    <label>// Input Text</label>
    <textarea id="inputText" placeholder="Enter any text — a review, tweet, sentence, or paragraph...&#10;&#10;e.g., &quot;This product is absolutely amazing! Great quality and fast delivery.&quot;"></textarea>
    <div class="controls">
      <button class="btn-primary" onclick="analyze()">
        <span id="btnText">Analyze Sentiment</span>
      </button>
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
      <span id="charCount">0 chars</span>
    </div>
  </div>

  <div id="result">
    <div class="result-header">
      <div class="sentiment-label" id="labelEl">—</div>
      <div class="score-pill" id="scorePill">score: 0.0000</div>
    </div>
    <div class="result-body">
      <div class="metric-block">
        <label>// Confidence</label>
        <div id="confidenceVal" style="font-size:1.4rem; font-weight:700">—</div>
        <div class="confidence-bar">
          <div class="confidence-fill" id="confFill" style="width:0%"></div>
        </div>
      </div>
      <div class="metric-block">
        <label>// Word Count</label>
        <div id="wordCountEl" style="font-family:var(--mono); font-size:1.4rem; font-weight:700">—</div>
      </div>
      <div class="highlights-area" style="grid-column: 1 / -1;">
        <label>// Key Words Detected</label>
        <div class="highlights-list" id="highlightsList"></div>
      </div>
    </div>
  </div>

  <div id="historySection">
    <p class="section-title">// Recent Analyses</p>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="examples-section">
    <p class="section-title">// Try These Examples</p>
    <div class="examples-grid">
      <button class="example-btn" onclick="loadExample(this)">This product is absolutely amazing! Great quality and fast delivery 😊</button>
      <button class="example-btn" onclick="loadExample(this)">Terrible experience. The service was awful and the staff were rude.</button>
      <button class="example-btn" onclick="loadExample(this)">The package arrived today. It is a medium-sized box.</button>
      <button class="example-btn" onclick="loadExample(this)">Not bad at all! I didn't expect it to be this good. Really impressed.</button>
      <button class="example-btn" onclick="loadExample(this)">Worst purchase I've ever made. Completely useless and broken on arrival 👎</button>
      <button class="example-btn" onclick="loadExample(this)">Very helpful documentation. The tutorial was clear and well-structured.</button>
    </div>
  </div>

  <footer>
    <span>SentimentIQ — Amazon ML Summer School 2026 Project</span>
    <span>Built with Python · Flask · Hybrid NLP</span>
  </footer>
</div>

<script>
  const textarea = document.getElementById("inputText");
  const charCount = document.getElementById("charCount");
  const history = [];

  textarea.addEventListener("input", () => {
    charCount.textContent = textarea.value.length + " chars";
  });

  async function analyze() {
    const text = textarea.value.trim();
    if (!text) return;

    const btn = document.getElementById("btnText");
    btn.innerHTML = '<span class="spinner"></span>Analyzing...';

    try {
      const res = await fetch("/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      const data = await res.json();
      renderResult(data);
      addToHistory(data);
    } catch (e) {
      alert("Error connecting to server. Make sure Flask is running.");
    } finally {
      btn.textContent = "Analyze Sentiment";
    }
  }

  function renderResult(data) {
    const resultEl = document.getElementById("result");
    resultEl.style.display = "block";

    const label = data.label;
    const labelEl = document.getElementById("labelEl");
    labelEl.textContent = label;
    labelEl.className = "sentiment-label " + label;

    const scorePill = document.getElementById("scorePill");
    scorePill.textContent = "score: " + data.score.toFixed(4);
    scorePill.className = "score-pill " + label;

    const confPct = Math.round(data.confidence * 100);
    document.getElementById("confidenceVal").textContent = confPct + "%";
    const fill = document.getElementById("confFill");
    fill.className = "confidence-fill " + label;
    setTimeout(() => fill.style.width = confPct + "%", 50);

    document.getElementById("wordCountEl").textContent = data.word_count + " words";

    const hList = document.getElementById("highlightsList");
    hList.innerHTML = "";
    if (data.highlights.length === 0) {
      hList.innerHTML = '<span style="font-family:var(--mono);font-size:0.75rem;color:var(--muted)">No strong sentiment words detected.</span>';
    } else {
      data.highlights.forEach(h => {
        const chip = document.createElement("span");
        chip.className = "highlight-chip " + h.type;
        chip.textContent = h.word;
        hList.appendChild(chip);
      });
    }
  }

  function addToHistory(data) {
    history.unshift(data);
    const section = document.getElementById("historySection");
    const list = document.getElementById("historyList");
    section.style.display = "block";
    list.innerHTML = "";
    history.slice(0, 5).forEach(d => {
      const item = document.createElement("div");
      item.className = "history-item";
      item.innerHTML = `
        <div class="history-dot ${d.label}"></div>
        <div class="history-text">${d.text_preview}</div>
        <div class="history-label ${d.label}">${d.label}</div>
      `;
      list.appendChild(item);
    });
  }

  function clearAll() {
    textarea.value = "";
    charCount.textContent = "0 chars";
    document.getElementById("result").style.display = "none";
  }

  function loadExample(btn) {
    textarea.value = btn.textContent.trim();
    charCount.textContent = textarea.value.length + " chars";
    analyze();
  }

  textarea.addEventListener("keydown", e => {
    if (e.ctrlKey && e.key === "Enter") analyze();
  });
</script>
</body>
</html>
